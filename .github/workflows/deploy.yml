name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  gate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Verify datasets and schema
        run: npm run verify

      - name: Run test contract suite
        run: npm test

      - name: Stamp build ID
        run: node scripts/stamp-build-id.mjs

      - name: Check Cloudflare credentials
        id: cf_auth
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::warning::CLOUDFLARE_API_TOKEN is not configured in repository secrets. Automated edge deployment skipped. Add CLOUDFLARE_API_TOKEN in GitHub Settings > Secrets and variables > Actions."
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.cf_auth.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "74ad6bf8dfaaccf82de6f0847f7d2d54"
          command: deploy

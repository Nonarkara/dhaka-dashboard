name: Validate and optionally release Dhaka

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Run the canonical production release after validation
        type: boolean
        required: true
        default: false

# A push never deploys. Manual CI releases serialize; local canonical releases
# additionally check that no manual CI run is queued/running before upload.
concurrency:
  group: dhaka-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  gate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Verify datasets and schema
        run: npm run verify

      - name: Run test contract suite
        run: npm test

      - name: Select release writer
        id: cf_auth
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
          DHAKA_RELEASE_DIR: ${{ runner.temp }}/dhaka-release
        run: |
          echo "release_requested=$RELEASE_REQUESTED" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE_REQUESTED" != true ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "### Validation only — no deployment" >> "$GITHUB_STEP_SUMMARY"
            echo "Checks passed; production was not deployed or verified by this run." >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$CF_TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::error::A manual release was requested but CLOUDFLARE_API_TOKEN is not configured. Production was not deployed."
            node scripts/lib/release-receipt.mjs init "$DHAKA_RELEASE_DIR/receipt.json"
            node scripts/lib/release-receipt.mjs refuse "$DHAKA_RELEASE_DIR/receipt.json" credentials cloudflare-token-not-configured
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Canonical deploy and live verification
        if: github.event_name == 'workflow_dispatch' && inputs.release && steps.cf_auth.outputs.has_token == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DHAKA_RELEASE_DIR: ${{ runner.temp }}/dhaka-release
        run: bash scripts/deploy-live.sh

      - name: Summarize release outcome
        if: always() && steps.cf_auth.outputs.release_requested == 'true'
        run: node scripts/lib/release-receipt.mjs summary "${{ runner.temp }}/dhaka-release/receipt.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve release receipt and stage logs
        if: always() && steps.cf_auth.outputs.release_requested == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dhaka-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dhaka-release/
          if-no-files-found: warn
          retention-days: 14

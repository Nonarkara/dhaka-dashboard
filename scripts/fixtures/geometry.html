<!doctype html><meta charset="utf-8"><title>Dhaka geometry verification</title><style>html,body{margin:0}iframe{border:0;display:block}#measure{display:none}</style><iframe id="case"></iframe><pre id="measure"></pre><script>
const q=new URLSearchParams(location.search),w=Number(q.get('w')||390),h=Number(q.get('h')||844),frame=document.querySelector('iframe');frame.width=w;frame.height=h;frame.src=(q.has('old')?'/__before.html':'/')+'?lang='+(q.get('lang')||'en')+'&area=parliament';
frame.onload=()=>{const d=frame.contentDocument;if(q.has('oldControls')){const link=d.createElement('link');link.rel='stylesheet';link.href='/__before-controls.css';d.head.appendChild(link)}if(q.has('error')){const fetchOriginal=frame.contentWindow.fetch;frame.contentWindow.fetch=(input,options)=>String(input).includes('/api/atlas/outlook')?Promise.reject(new Error('geometry-offline-injection')):fetchOriginal(input,options)}if(q.get('lens')){const s=d.querySelector('#atlas-lens');s.value=q.get('lens');s.dispatchEvent(new Event('change'))}if(q.has('menu'))d.querySelector('#atlas-menu').open=true;if(q.has('key'))d.querySelector('#building-key details').open=true;};
setInterval(()=>{const d=frame.contentDocument;if(!d?.querySelector('.atlas-watch'))return;const rect=s=>{const el=d.querySelector(s);if(!el)return null;const r=el.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height,scrollWidth:el.scrollWidth}};const regions={header:rect('.atlas-header'),rail:rect('.atlas-lenses'),story:rect('.atlas-lens-story'),map:rect('.atlas-map-wrap'),watch:rect('.atlas-watch'),player:rect('#forecast-player')};const controls=[...d.querySelectorAll('.atlas-header button,.atlas-header select,.atlas-menu-summary,#forecast-player:not([hidden]) .forecast-controls button')].filter(e=>!e.closest('details:not([open])') || e.closest('summary')?.parentElement===e.closest('details:not([open])')).map(e=>{const r=e.getBoundingClientRect();return{id:e.id||e.className,x:r.x,y:r.y,width:r.width,height:r.height,scrollWidth:e.scrollWidth}});const out={width:w,height:h,state:q.toString(),page:{width:d.documentElement.scrollWidth,height:d.documentElement.scrollHeight},regions,controls,combinedChrome:regions.map.y,informationActionDistance:regions.map.y-(controls.find(c=>c.id==='atlas-lens')?.y+controls.find(c=>c.id==='atlas-lens')?.height || regions.header.height),pass:regions.map.y<=48&&(regions.player?.height ? regions.player.y>=48&&regions.player.y+regions.player.height<=regions.watch.y-4 : true)&&regions.map.height>=h*.6&&controls.every(r=>r.x>=0&&r.x+r.width<=w+1&&r.height>=36)&&d.documentElement.scrollWidth<=w};document.querySelector('#measure').textContent=JSON.stringify(out)},500);
const scale=Math.min(1,innerWidth/w,(innerHeight-10)/h);frame.style.transform=`scale(${scale})`;frame.style.transformOrigin='top left';document.body.style.width=w*scale+'px';
</script>

<!doctype html><meta charset="utf-8"><title>Dhaka rendered geometry verification</title><style>html,body{margin:0;padding:0}iframe{border:0;display:block}</style><iframe id="case"></iframe><script>
const q=new URLSearchParams(location.search),w=Number(q.get('w')||390),h=Number(q.get('h')||844),old=q.has('old');
document.body.style.width=w+'px';let frame=document.querySelector('iframe');frame.width=w;frame.height=h;frame.src='/?lang='+ (q.get('lang')||'en')+(q.get('area')?'&area='+encodeURIComponent(q.get('area')):'');frame.onload=()=>{if(old){const link=[...frame.contentDocument.querySelectorAll('link[rel="stylesheet"]')].find(x=>x.href.includes('/style.css'));link.href='/__old-style.css'}};
</script>
<pre id="measure"></pre><script>
setInterval(()=>{const d=frame.contentDocument;if(!d?.querySelector('.atlas-watch'))return;const regions=['.atlas-header','.atlas-lenses','.atlas-lens-story','.atlas-map-wrap','.atlas-watch'];const data={width:w,height:h,regions:regions.map(selector=>{const e=d.querySelector(selector),r=e.getBoundingClientRect();return {selector,x:r.x,y:r.y,width:r.width,height:r.height,scrollWidth:e.scrollWidth}})};data.buildingCaption=d.querySelector('#atlas-lens-description').textContent;data.controls=[...d.querySelectorAll('.atlas-header button,.atlas-header select,.atlas-menu-summary,.atlas-watch-item')].filter(e=>e.getClientRects().length).map(e=>{const r=e.getBoundingClientRect();return {id:e.id||e.className,left:r.left,right:r.right,top:r.top,bottom:r.bottom,scrollWidth:e.scrollWidth,width:r.width}});data.pass=data.controls.every(r=>r.left>=0&&r.right<=w+1&&r.scrollWidth<=r.width+1)&&data.regions.every(r=>r.selector==='.atlas-lenses'||r.scrollWidth<=r.width+1)&&data.regions[3].height>=h*.6&&data.regions[4].y+data.regions[4].height<=h-20;document.querySelector('#measure').textContent=JSON.stringify(data,null,2)},1000);
</script><style>#measure{display:none}</style><script>const scale=Math.min(1,innerWidth/w,(innerHeight-10)/h);frame.style.transform=`scale(${scale})`;frame.style.transformOrigin='top left';document.body.style.width=(w*scale)+'px';</script>

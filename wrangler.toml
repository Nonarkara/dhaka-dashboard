name = "dhaka-dashboard"
workers_dev = true
# Same account as bkk-3d-atlas, kl-3d-atlas, and jakarta-3d-atlas. A local deploy must not land elsewhere.
account_id = "74ad6bf8dfaaccf82de6f0847f7d2d54"
main = "src/index.ts"
compatibility_date = "2026-08-26"
compatibility_flags = ["nodejs_compat"]

# Custom domain; the nonarkara.org zone is on this account.
[[routes]]
pattern = "dhaka.nonarkara.org"
custom_domain = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Cloudflare Workers Rate Limiting: 600/min per client IP.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "4208"
simple = { limit = 600, period = 60 }

[[r2_buckets]]
binding = "OBSERVATION_ARCHIVE"
bucket_name = "dhaka-observations"

[[d1_databases]]
binding = "OBSERVATION_DB"
database_name = "dhaka-observations"
database_id = "61bdde6b-5afb-4dda-95ad-2971839f9416"
migrations_dir = "migrations"

[triggers]
crons = ["*/15 * * * *"]
